name: Inspect video project
on:
  workflow_dispatch:
  push:
    paths:
      - "bhul-bill-video-builder-16x9.zip"
      - ".github/workflows/inspect-video-project.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect uploaded ZIP and capture source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/video-project
          unzip -q bhul-bill-video-builder-16x9.zip -d /tmp/video-project
          ROOT=/tmp/video-project/bhul-bill-video-builder/template
          {
            echo "# Project inspection"
            echo
            echo "Generated: $(date -u)"
            echo
            echo "## Files"
            find /tmp/video-project -maxdepth 6 -type f | sort | sed 's#^/tmp/video-project/##' | head -300
            echo
            echo "## package.json"
            cat "$ROOT/package.json"
            for file in src/Root.tsx src/Video.tsx src/index.ts src/data.ts src/brand.ts src/theme.ts src/chrome.tsx src/scenes.tsx; do
              echo
              echo "## SOURCE: $file"
              echo '~~~tsx'
              cat "$ROOT/$file"
              echo '~~~'
            done
            echo
            echo "## Archive summary"
            unzip -l bhul-bill-video-builder-16x9.zip | tail -5
          } > project-inspection.md
      - name: Publish inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-inspection.md
          git commit -m "Refresh full project inspection report" || exit 0
          git push
